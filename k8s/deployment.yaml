apiVersion: apps/v1
kind: Deployment
metadata:
  name: snyk-demo-app
  labels:
    app: snyk-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snyk-demo-app
  template:
    metadata:
      labels:
        app: snyk-demo-app
    spec:
      containers:
        - name: snyk-demo-app
          image: snyk-demo-app:latest
          ports:
            - containerPort: 3000
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true